name: Build and Release Java Application

on:
  push:
    tags:
      - 'v*' # Triggers when a new tag starting with 'v' is created, e.g., v1.0.0

permissions:
  contents: write # Required to create releases

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Caches dependencies for faster builds

      - name: Build with Maven
        run: mvn clean package

      # The current approach is to upload every JAR generated by Maven ("myapp.jar", "myapp-1-0-0.jar", "myapp-with-dependencies.jar", etc.).
      # To upload only the JAR with dependencies ("myapp.jar"), uncomment this step and use the commented `files` value below.
      #
      # - name: Get dependency-inclusive JAR file name
      #   id: get_jar_name
      #   run: |
      #     ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
      #     JAR_FILE="target/${ARTIFACT_ID}.jar"
      #     if [ ! -f "$JAR_FILE" ]; then
      #       echo "Expected release JAR not found: $JAR_FILE"
      #       exit 1
      #     fi
      #     echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Create Release and Upload JAR
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          # files: ${{ steps.get_jar_name.outputs.jar_file }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            Please refer to [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details on this release.
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
